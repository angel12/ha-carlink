[project]
name = "ha-carlink"
version = "0.1.0"
description = "Home Assistant custom integration for Carlink"
requires-python = ">=3.14.2"
dependencies = [
  "pycarlink@git+https://github.com/angel12/PyCarLink.git@a11d551491fc8e6025c7d68314cc7666d040cbac",
]

[dependency-groups]
test = [
  "homeassistant==2026.9.3",
  "pytest-homeassistant-custom-component==0.13.366",
  "pytest==9.0.3",
  "pytest-asyncio==1.4.0",
  "pytest-socket==0.8.0",
  "pip==26.2",
  "ruff==0.15.10",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
addopts = "--disable-socket --allow-unix-socket"

[tool.ruff]
target-version = "py314"
line-length = 88
